<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1500px;height:1000px;background:#f7f6f3;
  font:16px/1.45 ui-sans-serif,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;color:#1c1b18}
svg{display:block}
.t{font:600 15px ui-sans-serif,-apple-system,"Segoe UI",Helvetica,sans-serif;fill:#1c1b18}
.s{font:13px ui-sans-serif,-apple-system,"Segoe UI",Helvetica,sans-serif;fill:#6b665c}
.lbl{font:600 11.5px ui-sans-serif,-apple-system,"Segoe UI",Helvetica,sans-serif;
  fill:#9b958a;letter-spacing:.09em}
.edge{font:600 12.5px ui-sans-serif,-apple-system,"Segoe UI",Helvetica,sans-serif;fill:#6b665c}
</style></head><body>
<svg width="1500" height="1000" viewBox="0 0 1500 1000" xmlns="http://www.w3.org/2000/svg">
<defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0.5 L9,5 L0,9.5 z" fill="#9b958a"/></marker>
  <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0.5 L9,5 L0,9.5 z" fill="#9c2f22"/></marker>
  <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0.5 L9,5 L0,9.5 z" fill="#2f6d4f"/></marker>
</defs>

<text x="60" y="62" style="font:700 30px ui-sans-serif,-apple-system,Helvetica,sans-serif;fill:#1c1b18;letter-spacing:-.02em">Recall — how one sweep decides</text>
<text x="60" y="92" style="font:16px ui-sans-serif,-apple-system,Helvetica,sans-serif;fill:#6b665c">Thousands of public recall notices in. Almost always, nothing out.</text>

<!-- COLUMN LABELS -->
<text x="60"   y="152" class="lbl">PUBLIC FEEDS</text>
<text x="415"  y="152" class="lbl">DETERMINISTIC PASS · FREE</text>
<text x="835"  y="152" class="lbl">STRANDS AGENTS ON BEDROCK · PAID</text>
<text x="1270" y="152" class="lbl">OUTCOME</text>

<!-- feeds -->
<g>
  <rect x="60" y="175" width="270" height="62" rx="9" fill="#fff" stroke="#e4e1da"/>
  <text x="82" y="205" class="t">CPSC</text><text x="82" y="224" class="s">consumer products</text>
  <rect x="60" y="249" width="270" height="62" rx="9" fill="#fff" stroke="#e4e1da"/>
  <text x="82" y="279" class="t">NHTSA</text><text x="82" y="298" class="s">vehicles, car seats, tyres</text>
  <rect x="60" y="323" width="270" height="62" rx="9" fill="#fff" stroke="#e4e1da"/>
  <text x="82" y="353" class="t">openFDA</text><text x="82" y="372" class="s">food, drugs, devices</text>
</g>
<g>
  <rect x="60" y="440" width="270" height="78" rx="9" fill="#eef2f6" stroke="#c9d6e2"/>
  <text x="82" y="472" class="t">What you own</text>
  <text x="82" y="491" class="s">inventory, extracted from</text>
  <text x="82" y="508" class="s">pasted receipts by an agent</text>
</g>

<!-- blocking -->
<rect x="415" y="175" width="300" height="343" rx="11" fill="#fff" stroke="#e4e1da" stroke-width="1.5"/>
<text x="440" y="212" class="t">Score every pair</text>
<text x="440" y="243" class="s">brand aliases · product tokens</text>
<text x="440" y="264" class="s">model numbers · sale window</text>
<line x1="440" y1="288" x2="690" y2="288" stroke="#e4e1da"/>
<text x="440" y="316" class="s" style="fill:#1c1b18;font-weight:600">Rules are good at</text>
<text x="440" y="339" class="s">exact model numbers, date</text>
<text x="440" y="358" class="s">arithmetic, doing it for free</text>
<text x="440" y="392" class="s" style="fill:#1c1b18;font-weight:600">Rules are blind to</text>
<text x="440" y="415" class="s">“is a Ninja BN701 covered by</text>
<text x="440" y="434" class="s">a BlendJet recall?”</text>
<text x="440" y="470" class="s" style="fill:#8a5a12;font-weight:600">So ambiguity passes upward.</text>
<text x="440" y="492" class="s">A pair wrongly dropped is never seen</text>
<text x="440" y="510" class="s">again; one wrongly kept costs one call.</text>

<!-- matcher -->
<rect x="835" y="175" width="300" height="190" rx="11" fill="#fff" stroke="#c9d6e2" stroke-width="1.5"/>
<text x="860" y="210" class="t">RecallMatcher</text>
<text x="860" y="232" class="s">Does this notice cover the thing</text>
<text x="860" y="250" class="s">this person actually owns?</text>
<rect x="860" y="266" width="86" height="25" rx="5" fill="#eaf3ed"/>
<text x="872" y="284" style="font:600 12px ui-sans-serif,Helvetica;fill:#2f6d4f">no_match</text>
<rect x="954" y="266" width="86" height="25" rx="5" fill="#fbf1de"/>
<text x="962" y="284" style="font:600 12px ui-sans-serif,Helvetica;fill:#8a5a12">need_info</text>
<rect x="1048" y="266" width="66" height="25" rx="5" fill="#fbeae7"/>
<text x="1060" y="284" style="font:600 12px ui-sans-serif,Helvetica;fill:#9c2f22">match</text>
<text x="860" y="320" class="s" style="fill:#8a5a12">need_info = only the owner can</text>
<text x="860" y="338" class="s" style="fill:#8a5a12">resolve it. That question is the</text>
<text x="860" y="356" class="s" style="fill:#8a5a12">whole reason the agent speaks.</text>

<!-- triage -->
<rect x="835" y="400" width="300" height="160" rx="11" fill="#fff" stroke="#c9d6e2" stroke-width="1.5"/>
<text x="860" y="435" class="t">RecallTriage</text>
<text x="860" y="457" class="s">Is this worth interrupting a</text>
<text x="860" y="475" class="s">human being, and what do they do?</text>
<text x="860" y="507" class="s">severity · deadline · plain-English</text>
<text x="860" y="525" class="s">explanation · drafted message to</text>
<text x="860" y="543" class="s">the manufacturer</text>

<!-- outcomes -->
<rect x="1215" y="175" width="230" height="150" rx="11" fill="#fbeae7" stroke="#e3b5ad" stroke-width="1.5"/>
<text x="1238" y="212" class="t" style="fill:#9c2f22">Alert</text>
<text x="1238" y="238" class="s">the rare thing that</text>
<text x="1238" y="256" class="s">actually affects you</text>
<text x="1238" y="284" class="s">what happened · what</text>
<text x="1238" y="302" class="s">to do · draft to send</text>

<rect x="1215" y="400" width="230" height="160" rx="11" fill="#eaf3ed" stroke="#b3d2c1" stroke-width="1.5"/>
<text x="1238" y="437" class="t" style="fill:#2f6d4f">Silence log</text>
<text x="1238" y="463" class="s">every notice read and</text>
<text x="1238" y="481" class="s">deliberately not shown,</text>
<text x="1238" y="499" class="s">with the stage that</text>
<text x="1238" y="517" class="s">dismissed it and why</text>
<text x="1238" y="545" class="s" style="font-weight:600">the credibility artifact</text>

<!-- edges -->
<path d="M330 206 L400 206 L400 330 L410 330" fill="none" stroke="#9b958a" stroke-width="1.6" marker-end="url(#a)"/>
<path d="M330 280 L400 280 L400 330 L410 330" fill="none" stroke="#9b958a" stroke-width="1.6"/>
<path d="M330 354 L400 354 L400 330 L410 330" fill="none" stroke="#9b958a" stroke-width="1.6"/>
<path d="M330 479 L372 479 L372 348 L410 348" fill="none" stroke="#9b958a" stroke-width="1.6" marker-end="url(#a)"/>

<path d="M715 240 L830 240" fill="none" stroke="#9b958a" stroke-width="1.6" marker-end="url(#a)"/>
<text x="722" y="230" class="edge">handful survive</text>

<path d="M715 470 L775 470 L775 640 L1330 640 L1330 565" fill="none" stroke="#2f6d4f" stroke-width="1.6" marker-end="url(#ag)"/>
<text x="790" y="632" class="edge" style="fill:#2f6d4f">~99% ruled out for free — straight to the silence log</text>

<path d="M835 278 L800 278 L800 655 L1318 655 L1318 565" fill="none" stroke="#2f6d4f" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#ag)"/>

<path d="M1090 291 L1090 380 L985 380 L985 395" fill="none" stroke="#9c2f22" stroke-width="1.6" marker-end="url(#ar)"/>
<text x="1000" y="376" class="edge" style="fill:#9c2f22">match</text>

<path d="M1135 250 L1210 250" fill="none" stroke="#8a5a12" stroke-width="1.6" marker-end="url(#ar)"/>
<text x="1138" y="240" class="edge" style="fill:#8a5a12">need_info</text>

<path d="M1135 460 L1175 460 L1175 300 L1210 300" fill="none" stroke="#9c2f22" stroke-width="1.6" marker-end="url(#ar)"/>
<text x="1148" y="352" class="edge" style="fill:#9c2f22">notify</text>

<line x1="60" y1="700" x2="1445" y2="700" stroke="#e4e1da"/>
<text x="60" y="738" style="font:600 15px ui-sans-serif,Helvetica;fill:#1c1b18">Three near-misses from the demo corpus — why both layers exist</text>

<rect x="60" y="762" width="440" height="128" rx="9" fill="#fff" stroke="#e4e1da"/>
<text x="84" y="792" class="t" style="font-size:14px">Ryobi P215K vs a P215Q recall</text>
<text x="84" y="818" class="s">Bought Aug 2020; affected units sold 2022–23.</text>
<text x="84" y="838" class="s">Ruled out on date arithmetic alone.</text>
<text x="84" y="868" class="s" style="fill:#2f6d4f;font-weight:600">Killed for free. No model call.</text>

<rect x="533" y="762" width="440" height="128" rx="9" fill="#fff" stroke="#e4e1da"/>
<text x="557" y="792" class="t" style="font-size:14px">IKEA BILLY vs an IKEA MALM recall</text>
<text x="557" y="818" class="s">Same brand, same category, same retailer.</text>
<text x="557" y="838" class="s">No rule throws this out.</text>
<text x="557" y="868" class="s" style="fill:#8a5a12;font-weight:600">The matcher does.</text>

<rect x="1006" y="762" width="439" height="128" rx="9" fill="#fff" stroke="#e4e1da"/>
<text x="1030" y="792" class="t" style="font-size:14px">Graco 4Ever DLX car seat</text>
<text x="1030" y="818" class="s">Recall covers specific model numbers printed</text>
<text x="1030" y="838" class="s">on a label. A receipt cannot settle it.</text>
<text x="1030" y="868" class="s" style="fill:#9c2f22;font-weight:600">So it asks you to read one label.</text>

<text x="60" y="945" class="s">Strands Agents SDK · Amazon Bedrock · 4 agents, 5 @tool functions, typed structured output · MIT</text>
</svg></body></html>
